<style id="lockcss">
html.lock{box-sizing:border-box}
html.lock *{box-sizing:inherit}
html.lock body{margin:0;min-height:100vh;display:grid;place-items:center;background:#460407;color:#f7f4ef;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
#lockbox{width:min(380px,100%);background:#131011;border-radius:20px;padding:32px 26px;display:grid;gap:14px;text-align:center}
#lockbox img{height:56px;width:auto;max-width:100%;justify-self:center}
#lockbox h1{margin:0;font-size:20px}
#lockbox p{margin:0;color:#c9b8b4;font-size:15px}
#lockbox input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid #352b2c;background:#1c1718;color:#f7f4ef;text-align:center;letter-spacing:.2em}
#lockbox input[type=password]:focus{outline:none;border-color:#f39330}
#lockbox button{font:700 16px system-ui,sans-serif;background:#f7f4ef;color:#460407;border:2px solid #131011;border-radius:14px;padding:12px 20px;box-shadow:4px 4px 0 #f39330;cursor:pointer}
#lockbox label{font-size:14px;color:#c9b8b4;display:flex;gap:8px;justify-content:center;align-items:center}
#lockbox .err{color:#ff9f8f;font-size:14px;min-height:1.4em}
</style></head><body>

</form>

var K='pasme-key', T='pasme-exp';
function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function unhex(h){return new Uint8Array(h.match(/../g).map(function(x){return parseInt(x,16)}))}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function del(){try{localStorage.removeItem(K);localStorage.removeItem(T)}catch(e){}}
async function open(raw){
  var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.ct)));
  // remove o visual da tela de senha antes de montar o site, para nada vazar
  var css=document.getElementById('lockcss'); if(css) css.remove();
  document.documentElement.className='';
  document.open();document.write(html);document.close();
}
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(P.salt),iterations:P.it,hash:'SHA-256'},base,256);
}
var f=document.getElementById('lockbox'), err=document.getElementById('err');
(async function(){
  var saved=get(K), exp=+get(T)||0;
  if(saved && Date.now()<exp){ try{ await open(unhex(saved)); return; }catch(e){ del(); } }
  f.hidden=false; document.getElementById('pw').focus();
})();
f.addEventListener('submit',async function(e){
  e.preventDefault(); err.textContent='Verificando...';
  try{
    var raw=await derive(document.getElementById('pw').value);
    if(document.getElementById('rm').checked){ set(K,hex(raw)); set(T,String(Date.now()+30*864e5)); }
    await open(new Uint8Array(raw));
  }catch(x){ err.textContent='Senha incorreta'; }
});
})();
</script>
